services:
  # Reverse Proxy - Routes traffic to appropriate services
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic
      - traefik_logs:/var/log/traefik
    networks:
      - lab-network

  # LTI Tool Server - Handles LMS authentication (1.1 and 1.3)
  lti-server:
    build:
      context: .
      dockerfile: lti/Dockerfile
    container_name: lti-server
    restart: unless-stopped
    environment:
      - ORCHESTRATOR_API=http://lab-api:8000
      - LAB_API_SERVICE_TOKEN=${LAB_API_SERVICE_TOKEN}
      - LTI_BASE_URL=${LTI_BASE_URL}
      - DOMAIN=${DOMAIN}
      - DATABASE_URL=postgresql://lti:${LTI_DB_PASS}@postgres:5432/lti
      # LTI 1.1 Consumer Secrets
      - LTI11_CANVAS_SECRET=${LTI11_CANVAS_SECRET}
      - LTI11_BLACKBOARD_SECRET=${LTI11_BLACKBOARD_SECRET}
      - LTI11_MOODLE_SECRET=${LTI11_MOODLE_SECRET}
      - LTI11_BRIGHTSPACE_SECRET=${LTI11_BRIGHTSPACE_SECRET}
      - LTI11_LTIBROKER_SECRET=${LTI11_LTIBROKER_SECRET}
      # Session secret for cookies
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./lti/keys:/app/keys:ro
      - ./lti/lti13_config.json:/app/lti13_config.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lti.rule=Host(`lti.${DOMAIN}`)"
      - "traefik.http.routers.lti.entrypoints=websecure"
      - "traefik.http.routers.lti.tls=true"
      - "traefik.http.services.lti.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      lab-api:
        condition: service_started
    networks:
      - lab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/lti/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # VM Orchestration API - Manages VM lifecycle via Proxmox
  lab-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lab-api
    restart: unless-stopped
    environment:
      # Proxmox connection
      - PROXMOX_HOST=${PROXMOX_HOST}
      - PROXMOX_PORT=${PROXMOX_PORT:-8006}
      - PROXMOX_USER=${PROXMOX_USER:-root@pam}
      - PROXMOX_PASSWORD=${PROXMOX_PASSWORD}
      - PROXMOX_VERIFY_SSL=${PROXMOX_VERIFY_SSL:-false}
      - PROXMOX_NODE=${PROXMOX_NODE}
      - PROXMOX_STORAGE=${PROXMOX_STORAGE:-local-lvm}
      - PROXMOX_TEMPLATE_ID=${PROXMOX_TEMPLATE_ID:-500}
      - PROXMOX_BRIDGE=${PROXMOX_BRIDGE:-vmbr0}
      - PROXMOX_VLAN_TAG=${PROXMOX_VLAN_TAG:-}
      - PROXMOX_MTU=${PROXMOX_MTU:-}
      - MGMT_NETWORK_PREFIX=${MGMT_NETWORK_PREFIX:-}
      # VM configuration
      - VM_RAM_MB=${VM_RAM_MB:-16384}
      - VM_VCPUS=${VM_VCPUS:-4}
      - VM_ID_START=${VM_ID_START:-1000}
      - VM_ID_END=${VM_ID_END:-9999}
      # General
      - DOMAIN=${DOMAIN}
      - DATABASE_URL=postgresql://lab:${LAB_DB_PASS}@postgres:5432/lab
      - LTI11_CANVAS_SECRET=${LTI11_CANVAS_SECRET}
      - LTI11_BLACKBOARD_SECRET=${LTI11_BLACKBOARD_SECRET}
      - LTI11_MOODLE_SECRET=${LTI11_MOODLE_SECRET}
      - LTI11_BRIGHTSPACE_SECRET=${LTI11_BRIGHTSPACE_SECRET}
      - LTI11_LTIBROKER_SECRET=${LTI11_LTIBROKER_SECRET}
      - SSH_PRIVATE_KEY_PATH=/app/keys/id_ed25519
      - SSH_USER=${SSH_USER:-kiosk}
      - RECORDINGS_DIR=/var/lib/vm-lab/recordings
      - LAB_API_SERVICE_TOKEN=${LAB_API_SERVICE_TOKEN}
      # LRS grade backfill (disabled by default; see .env.example)
      - LRS_BACKFILL_ENABLED=${LRS_BACKFILL_ENABLED:-false}
      - LRS_READ_URL=${LRS_READ_URL:-https://lrs.labsconnect.org/xapi}
      - LRS_READ_AUTH=${LRS_READ_AUTH:-}
      - LRS_BACKFILL_CUTOFF=${LRS_BACKFILL_CUTOFF:-}
      - LRS_BACKFILL_DOMAINS=${LRS_BACKFILL_DOMAINS:-email.cpcc.edu,lab.cpcc.edu,email.edu.cpcc,cpcc.email.edu,cpcc.edu}
      # Browser RDP gateway; credentials remain in lab-api/Guacamole's
      # server-side connection store and are never sent to the browser.
      - GUACAMOLE_URL=${GUACAMOLE_URL:-http://guacamole/guacamole}
      - GUACD_HOST=${GUACD_HOST:-guacd}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./lti/keys:/app/keys:ro
      - ./traefik/dynamic:/app/traefik-dynamic
      - session_recordings:/var/lib/vm-lab/recordings
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab-network
      - vm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Guacamole protocol daemon. It has no public port; only the future
  # Guacamole web tier and lab-api may reach it on the private lab network.
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    restart: unless-stopped
    networks:
      - lab-network
      - vm-network

  # MVP browser RDP gateway. The access token endpoint is temporary; the lab
  # API will replace it with per-session, one-time tokens before production.
  rdp-gateway:
    build:
      context: ./rdp-gateway
      dockerfile: Dockerfile
    container_name: rdp-gateway
    restart: unless-stopped
    environment:
      - HTTP_PORT=8080
      - WS_PORT=8081
      - WS_PUBLIC_URL=${WS_PUBLIC_URL:-}
      - GUACD_HOST=${GUACD_HOST:-guacd}
      - PROTOTYPE_ACCESS_TOKEN=${PROTOTYPE_ACCESS_TOKEN}
      - GUACAMOLE_TOKEN_KEY=${GUACAMOLE_TOKEN_KEY}
      - RDP_HOST=${RDP_HOST}
      - RDP_PORT=${RDP_PORT:-3389}
      - RDP_USERNAME=${RDP_USERNAME}
      - RDP_PASSWORD=${RDP_PASSWORD}
    depends_on:
      - guacd
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rdp.rule=Host(`rdp.${DOMAIN}`)"
      - "traefik.http.routers.rdp.entrypoints=websecure"
      - "traefik.http.routers.rdp.tls=true"
      - "traefik.http.services.rdp.loadbalancer.server.port=8080"
      - "traefik.http.routers.rdp-ws.rule=Host(`rdp.${DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.rdp-ws.entrypoints=websecure"
      - "traefik.http.routers.rdp-ws.tls=true"
      - "traefik.http.routers.rdp-ws.service=rdp-ws"
      - "traefik.http.services.rdp-ws.loadbalancer.server.port=8081"
    networks:
      - lab-network
      - vm-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=lti,lab
      - LTI_DB_PASS=${LTI_DB_PASS}
      - LAB_DB_PASS=${LAB_DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/00-create-dbs.sh:ro
    networks:
      - lab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for session caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - lab-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Custom ttyd image with SSH client
  ttyd:
    build:
      context: ./ttyd
      dockerfile: Dockerfile
    image: vm-lab-ttyd:latest
    profiles:
      - build-only  # Only used for building, not running

  # Cloudflare Tunnel - Exposes services without opening firewall
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - lab-network
    depends_on:
      - traefik

networks:
  lab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  vm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24

volumes:
  postgres_data:
  redis_data:
  traefik_logs:
  session_recordings:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/vm-lab/recordings
